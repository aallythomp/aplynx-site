<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Rentals | APLYNX Investments</title><style>body{font:17px/1.6 Arial,sans-serif;background:#f7f7f2;color:#172c48;max-width:1000px;margin:auto;padding:24px}a{color:inherit}article{background:white;padding:24px;margin:20px 0;border-radius:16px;border:1px solid #dadfdc}.photos{display:flex;gap:12px;flex-wrap:wrap}.photos img{width:240px;max-width:100%;height:200px;object-fit:cover;border-radius:10px}.description{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><a href="/">APLYNX Investments</a> · <a href="/listing-account.html">My listings / Add a listing</a><h1>Rooms and homes for rent</h1><p id="status" role="status">Loading listings…</p><main id="listings"></main><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.49.8';
const status=document.getElementById('status');try{const config=await fetch('/api/listing-config').then(r=>r.json());if(config.error)throw Error(config.error);const db=createClient(config.url,config.key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});const{data,error}=await db.from('customer_listings').select('*,listing_photos(*)').eq('status','approved').order('reviewed_at',{ascending:false});if(error)throw error;status.textContent=data.length?'':'No customer listings are available yet.';for(const listing of data){const card=document.createElement('article');for(const[tag,text]of[['h2',listing.title],['p',listing.rental_type+' · '+listing.city+', GA'],['p','$'+listing.rent+'/month · $'+listing.deposit+' deposit'],['p',listing.description]]){const el=document.createElement(tag);el.textContent=text;el.className='description';card.append(el);}const photos=document.createElement('div');photos.className='photos';card.append(photos);document.getElementById('listings').append(card);for(const photo of listing.listing_photos||[]){const{data:signed,error}=await db.storage.from('listing-photos').createSignedUrl(photo.path,600);if(error)continue;const img=document.createElement('img');img.src=signed.signedUrl;img.alt=listing.title+' photo';img.loading='lazy';photos.append(img);}}}catch(e){status.textContent=e.message;}
</script></body></html>
