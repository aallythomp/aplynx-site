name: Populate APLYNX individual property galleries
on:
  push:
    paths:
      - '.github/workflows/populate-property-galleries.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pillow
      - name: Collect address-matched approved listing images
        run: python scripts/fetch-property-galleries.py
      - name: Save on-site photo galleries
        run: |
          git config user.name "APLYNX Gallery Assistant"
          git config user.email "actions@users.noreply.github.com"
          git add assets/property-galleries assets/property-galleries.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish individual approved photo galleries for APLYNX properties"
            git pull --rebase origin main
            git push
          else
            echo "No property galleries changed"
          fi
