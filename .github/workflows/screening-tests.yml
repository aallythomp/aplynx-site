name: Screening sandbox tests
on:
  pull_request:
    paths:
      - 'api/screening-test.mjs'
      - 'lib/screening.mjs'
      - 'lib/checkr-tenant.mjs'
      - 'lib/screening-store.mjs'
      - 'tests/screening.test.mjs'
      - '.github/workflows/screening-tests.yml'
  push:
    branches: [fix/checkr-test-order-status]
permissions:
  contents: read
jobs:
  screening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9fab683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test tests/screening.test.mjs tests/listings.test.mjs
